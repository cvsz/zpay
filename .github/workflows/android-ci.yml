name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android unit tests, lint and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Verify build tool versions
        run: gradle --version

      - name: Run unit tests and Android lint
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
